# Secret- und Öffentlich-Scan (Constitution VI, governance.md „Öffentlich vs. intern“, AK-2, AK-24).
# Aufruf immer über tools/public-scan: Dort kommt zur Laufzeit die Regel für die
# vertrauliche Sperrliste dazu, die selbst nie im Repo steht.

title = "codeslage"

[extend]
useDefault = true

# IP-Adressen von Servern gehören nicht ins öffentliche Repo.
[[rules]]
id = "codeslage-ipv4"
description = "IPv4-Adresse"
regex = '''\b(?:(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\.){3}(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)\b'''

[[rules.allowlists]]
description = "Loopback, Wildcard und Dokumentationsbereiche (RFC 5737)"
regexTarget = "match"
regexes = ['''^(?:127\.0\.0\.1|0\.0\.0\.0|192\.0\.2\.\d{1,3}|198\.51\.100\.\d{1,3}|203\.0\.113\.\d{1,3})$''']

[[rules]]
id = "codeslage-ipv6"
description = "IPv6-Adresse"
# Volle Form mit 8 Gruppen oder verkürzte Form mit „::“; Uhrzeiten wie 16:33:41 fallen nicht darunter.
regex = '''(?i)\b(?:[0-9a-f]{1,4}:){7}[0-9a-f]{1,4}\b|\b(?:[0-9a-f]{1,4}:){1,6}:(?:[0-9a-f]{1,4}(?::[0-9a-f]{1,4}){0,5})?'''

[[rules.allowlists]]
description = "Dokumentationsbereich (RFC 3849)"
regexTarget = "match"
regexes = ['''(?i)^2001:0?db8:''']

# Persönliche Kontaktdaten gehören nicht ins öffentliche Repo.
[[rules]]
id = "codeslage-email"
description = "E-Mail-Adresse"
regex = '''\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'''

[[rules.allowlists]]
description = "Platzhalter (RFC 2606), GitHub-noreply, Git-SSH, KI-Co-Autor; freigegebene Rollenadressen hier ergänzen"
regexTarget = "match"
regexes = [
  '''@example\.(?:com|org|net)$''',
  '''@users\.noreply\.github\.com$''',
  '''^git@github\.com$''',
  '''^noreply@anthropic\.com$''',
]
