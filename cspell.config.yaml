# Rechtschreibprüfung für Doku (Deutsch) und Code (Englisch), Change 2026-11-18-rechtschreibung-cspell.
# Unbekannte Fachbegriffe gehören in project-words.txt, nicht in Ausnahmen im Text.
version: '0.2'
language: en,de-DE
import:
  - '@cspell/dict-de-de/cspell-ext.json'
dictionaryDefinitions:
  - name: project-words
    path: ./project-words.txt
    addWords: true
dictionaries:
  - project-words
useGitignore: true
ignorePaths:
  - .git/**
  - pnpm-lock.yaml
  - '**/.terraform.lock.hcl'
  - project-words.txt
  # Aufzeichnungen bleiben unverändert, auch mit Tippfehlern.
  - docs/protokolle/**
  - specs/**/reviews/**
  # cwk:project:start
  # cwk:project:end
