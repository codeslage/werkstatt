name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  public-scan:
    name: Secret- und Öffentlich-Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: pnpm über Corepack
        run: corepack enable

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      # Kein gitleaks-action: braucht für Organisationen einen Lizenzschlüssel (ADR 0008).
      - name: gitleaks installieren (gepinnt, Prüfsumme)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Tests des Scans
        run: pnpm test

      # Ebene 2 (governance.md): gesamte Historie inkl. dieses PRs, Sperrliste aus dem Secret.
      - name: Scan
        env:
          PUBLIC_BLOCKLIST: ${{ secrets.PUBLIC_BLOCKLIST }}
        run: node tools/public-scan/src/cli.ts git . --require-blocklist
