name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  # Gleiche Version wie lokal (fmt-Ergebnisse sollen nicht abweichen); Prüfsummen aus den offiziellen Releases.
  TOFU_VERSION: 1.13.1
  TOFU_SHA256: 378ada19d4bc70c43732004e8159be771b23b9a5afdf059e5f8a2b3fa2c70a69
  TFLINT_VERSION: 0.66.0
  TFLINT_SHA256: 22be11cadc25cd02401e94c0ccc91aa63467debb8485c2a755d98f4c0a9d1e2e

jobs:
  public-scan:
    name: Secret- und Öffentlich-Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # Kein gitleaks-action: braucht für Organisationen einen Lizenzschlüssel (ADR 0008).
      - name: gitleaks installieren (gepinnt, Prüfsumme)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Tests (alle Pakete; die Scan-Tests brauchen gitleaks)
        run: pnpm test

      # Ebene 2 (governance.md): gesamte Historie inkl. dieses PRs, Sperrliste aus dem Secret.
      - name: Scan
        env:
          PUBLIC_BLOCKLIST: ${{ secrets.PUBLIC_BLOCKLIST }}
        run: node tools/public-scan/src/cli.ts git . --require-blocklist

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Typecheck (alle Pakete)
        run: pnpm typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: ESLint (Komplexitäts- und Größengrenzen, Artikel XV)
        run: pnpm lint

  knip:
    name: Knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Ungenutzte Dateien, Exporte und Abhängigkeiten (Artikel XV)
        run: pnpm knip

  dependency-cruiser:
    name: Modulgrenzen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Zyklen und Abhängigkeitsrichtungen (Artikel XV)
        run: pnpm depcruise

  spec-check:
    name: Spec-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Pflichtteile aller spec.md und plan.md (Artikel I, AK-16)
        run: pnpm spec-check

  repo-settings:
    name: Repo-Einstellungen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Sichtbarkeit und Schutz von main bei GitHub (AK-1)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm test:infra repo.test.ts

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Einheitliche Formatierung (AK-30)
        run: pnpm format

  infra:
    name: Infra (OpenTofu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      # Wie bei gitleaks: Binaries direkt aus den Releases, gepinnt und mit Prüfsumme (keine zusätzlichen Actions).
      - name: OpenTofu und tflint installieren (gepinnt, Prüfsumme)
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          tofu="tofu_${TOFU_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tofu"             "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/$tofu"
          echo "${TOFU_SHA256}  $RUNNER_TEMP/$tofu" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tofu" -C "$RUNNER_TEMP/bin" tofu
          curl -sSfL -o "$RUNNER_TEMP/tflint.zip"             "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip"
          echo "${TFLINT_SHA256}  $RUNNER_TEMP/tflint.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/tflint.zip" -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Formatierung (AK-30)
        run: tofu fmt -check -recursive -diff infra/tofu

      # Ohne Backend und ohne Zugangsdaten: prüft nur die Konfiguration, liest keinen State (ADR 0002).
      - name: Validierung und tflint je Wurzel (AK-5, AK-18)
        run: |
          for root in infra/tofu/*/; do
            echo "::group::$root"
            tofu -chdir="$root" init -backend=false -input=false
            tofu -chdir="$root" validate
            tflint --chdir="$root" --config="$GITHUB_WORKSPACE/.tflint.hcl"
            echo "::endgroup::"
          done

      - name: Gegenbeispiele für fmt und tflint (Negativtests, AK-18, AK-30)
        run: pnpm test:infra hcl.test.ts

      # Geplante Workflows (AK-5, AK-24): Auslöser, Rechte, gleiche Tool-Versionen wie hier.
      - name: Geplante Workflows
        run: pnpm test:infra drift.test.ts history-scan.test.ts simulate-failure.test.ts

  image:
    name: Image (Compose + Smoke)
    runs-on: ubuntu-latest
    env:
      # Nur für die Wegwerf-DB dieses Laufs (Seed-Daten, tmpfs), kein Secret.
      POSTGRES_PASSWORD: ci-nur-zum-testen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Compose bauen und starten (AK-25, AK-26)
        run: pnpm dev:up

      - name: Smoke-Test – /health gegen das Schema, Container gesund, nur 127.0.0.1, ohne Root (AK-26)
        run: pnpm test:smoke

      - name: Container-Logs bei Fehler
        if: failure()
        run: docker compose logs

      # Gegenprobe (T-30): Ohne Seed-Zeile darf die Umgebung nicht gesund starten.
      - name: Gegenprobe – kaputter Seed muss scheitern
        run: |
          pnpm dev:down
          sed -i 's/^insert/-- insert/' infra/local/seed.sql
          if pnpm dev:up; then
            echo "::error::Umgebung trotz fehlender Seed-Zeile gesund"
            exit 1
          fi
          curl -s http://127.0.0.1:3000/health | grep -q '"seed missing"'

      - name: Compose stoppen
        if: always()
        run: pnpm dev:down
