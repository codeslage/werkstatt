name: CI

# Prüfungen aus dem CodeslageWerkzeugKasten (cwk-rules.yml, cwk-code.yml), dieselben wie in jedem Projekt-Repo,
# dazu die Jobs, die es nur in werkstatt gibt. Einziger Pflicht-Check im Ruleset ist ci-ok (Plan 05, AK-3):
# Ein neuer Job muss dort in `needs` stehen, im Ruleset ändert sich nichts.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: Regeln
    uses: ./.github/workflows/cwk-rules.yml
    secrets: inherit

  code:
    name: Code
    uses: ./.github/workflows/cwk-code.yml

  infra:
    name: Infra-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: OpenTofu und tflint installieren
        run: sh .github/scripts/install-tofu.sh --with-tflint

      - name: Gegenbeispiele für fmt und tflint (Negativtests, AK-18, AK-30)
        run: pnpm test:infra hcl.test.ts

      # Geplante und wiederverwendbare Workflows (AK-5, AK-24, Plan 05 AK-3): Auslöser, Rechte, gleiche Tool-Versionen.
      - name: Workflows
        run: pnpm test:infra drift.test.ts history-scan.test.ts simulate-failure.test.ts cwk-workflows.test.ts

  web:
    name: Webseite (E2E + Lighthouse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Chromium für Playwright und Lighthouse
        run: pnpm --filter @codeslage/web exec playwright install --with-deps chromium

      # Baut die Seite mit den Platzhaltern aus apps/web/.env.example und prüft sie über `astro preview`.
      - name: E2E – Navigation, SEO, Layout, Datenschutz (AK-1, AK-4, AK-7, AK-8)
        run: pnpm --filter @codeslage/web test:e2e

      # Auf dem Build aus dem E2E-Schritt; Berichte nur im Runner, kein öffentlicher Upload.
      - name: Lighthouse mobil, alle Seiten, alle Kategorien ≥ 90 (AK-6)
        run: pnpm --filter @codeslage/web lighthouse

  image:
    name: Image (Compose + Smoke)
    runs-on: ubuntu-latest
    env:
      # Nur für die Wegwerf-DB dieses Laufs (Seed-Daten, tmpfs), kein Secret.
      POSTGRES_PASSWORD: ci-nur-zum-testen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Compose bauen und starten (AK-25, AK-26)
        run: pnpm dev:up

      - name: Smoke-Test – /health gegen das Schema, Container gesund, nur 127.0.0.1, ohne Root (AK-26)
        run: pnpm test:smoke

      # Gegenprobe (T-30): Ohne Seed-Zeile darf die Umgebung nicht gesund starten.
      - name: Gegenprobe – kaputter Seed muss scheitern
        run: |
          pnpm dev:down
          sed -i 's/^insert/-- insert/' infra/local/seed.sql
          if pnpm dev:up; then
            echo "::error::Umgebung trotz fehlender Seed-Zeile gesund"
            exit 1
          fi
          curl -s http://127.0.0.1:3000/health | grep -q '"seed missing"'

      # Nach der Gegenprobe, damit auch ihr Scheitern Logs liefert.
      - name: Container-Logs bei Fehler
        if: failure()
        run: docker compose logs

      - name: Compose stoppen
        if: always()
        run: pnpm dev:down

  ci-ok:
    name: ci-ok
    if: always()
    needs: [rules, code, infra, web, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # failure und cancelled sind rot; skipped nur beim Code-Teil von Repos ohne Code (tools/cwk/src/ci-ok.ts).
      - name: Ergebnis aller Jobs auswerten
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node tools/cwk/src/cli.ts ci-ok
