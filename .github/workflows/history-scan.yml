name: Historien-Scan

# AK-24: gitleaks und Sperrliste über die gesamte Historie aller Branches. Der PR-Scan in ci.yml prüft dasselbe,
# läuft aber nur bei Änderungen; dieser Lauf greift auch dann, wenn sich Regeln oder Sperrliste geändert haben.
# Rot heißt: Runbook docs/runbooks/historien-scan.md.
on:
  schedule:
    - cron: '23 4 1 * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Absichtlich fehlschlagen (Test der Mail-Benachrichtigung, AK-27)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: history-scan
  cancel-in-progress: false

jobs:
  history-scan:
    name: Historien-Scan (gitleaks, Sperrliste)
    runs-on: ubuntu-latest
    steps:
      - name: Absichtlicher Fehlschlag (AK-27)
        if: inputs.simulate_failure
        run: echo "::error::Absichtlicher Fehlschlag über simulate_failure (AK-27)" && exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # Dieselbe Version wie in der CI (gemeinsames Skript, infra/tests/history-scan.test.ts).
      - name: gitleaks installieren
        run: sh .github/scripts/install-gitleaks.sh

      # Die Logs sind öffentlich: Treffer erscheinen nur geschwärzt (--redact in cli.ts).
      - name: Scan
        env:
          PUBLIC_BLOCKLIST: ${{ secrets.PUBLIC_BLOCKLIST }}
        run: node tools/public-scan/src/cli.ts git . --require-blocklist
