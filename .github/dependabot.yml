# Automatische Abhängigkeits-Updates per PR (Constitution XI, AK-29).
# Sicherheits-Updates sind zusätzlich in den Repo-Einstellungen aktiv (Protokoll T-22).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wie die Wartezeit von pnpm: frisch veröffentlichte Versionen erst nach einigen Tagen vorschlagen.
    cooldown:
      default-days: 3
    groups:
      typescript-eslint:
        patterns: ['typescript-eslint', '@typescript-eslint/*']
    ignore:
      # typescript-eslint unterstützt nur typescript < 6.1 (PR-04). Zurück auf neuere Versionen, sobald es das tut.
      - dependency-name: typescript
        versions: ['>=6.1']
      # Die Typen müssen zur Node-Version der Laufzeit passen (Node 24): nur Updates innerhalb von 24.x.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  # Provider-Versionen in versions.tf und .terraform.lock.hcl (eigenes Ökosystem „opentofu“, Registry von OpenTofu).
  - package-ecosystem: opentofu
    directories: ['/infra/tofu/*']
    schedule:
      interval: weekly
    cooldown:
      default-days: 3

  # Basis-Images (per Digest gepinnt): Dockerfiles der Apps und die Images in compose.yaml.
  - package-ecosystem: docker
    directories: ['/apps/*']
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      # Node 24 laut Plan, passend zu @types/node 24.x: nur neue Digests und Versionen innerhalb von 24.
      - dependency-name: node
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      # Ab Postgres 18 liegen die Daten an anderer Stelle; das tmpfs in compose.yaml müsste mitwandern. Major nur bewusst.
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
